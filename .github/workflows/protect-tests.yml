name: Vérifier l'intégrité des tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check-tests:
    name: Vérifier que les tests n'ont pas été modifiés
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du code étudiant
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout du template de référence
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/bash-tp01-premiersScripts
        path: template
        token: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

    - name: Vérifier l'intégrité des tests
      run: |
        echo "Vérification de l'intégrité des fichiers de test..."

        # Liste des fichiers protégés
        PROTECTED_FILES=(
          "Exos/ex1/test_ex1.sh"
          "Exos/ex2/test_ex2.sh"
          "Exos/ex3/test_ex3.sh"
          "run_all_tests.sh"
        )

        violations=0

        # Si on a réussi à récupérer le template, comparer les fichiers
        if [ -d "template" ]; then
          for file in "${PROTECTED_FILES[@]}"; do
            if [ -f "$file" ] && [ -f "template/$file" ]; then
              if ! diff -q "$file" "template/$file" > /dev/null 2>&1; then
                echo "❌ VIOLATION : Le fichier $file a été modifié !"
                echo "   Différences :"
                diff "$file" "template/$file" || true
                ((violations++))
              else
                echo "✅ $file : non modifié"
              fi
            fi
          done
        else
          # Méthode alternative : vérifier que les tests existent et sont exécutables
          echo "⚠️  Impossible de récupérer le template. Vérification basique..."
          for file in "${PROTECTED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ VIOLATION : Le fichier $file est manquant !"
              ((violations++))
            elif [ ! -x "$file" ]; then
              echo "⚠️  Le fichier $file n'est pas exécutable"
            else
              echo "✅ $file : présent et exécutable"
            fi
          done
        fi

        if [ $violations -gt 0 ]; then
          echo ""
          echo "=========================================="
          echo "❌ ÉCHEC : Des fichiers de test ont été modifiés"
          echo "=========================================="
          echo ""
          echo "Les fichiers de test ne doivent PAS être modifiés."
          echo "Si vous pensez qu'il y a une erreur dans les tests,"
          echo "contactez votre enseignant."
          echo ""
          exit 1
        else
          echo ""
          echo "=========================================="
          echo "✅ Tous les tests sont intègres"
          echo "=========================================="
        fi
